<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Explore India - Create Account</title>
    <!-- Link your global CSS file here (for your navbar/fonts) -->
    <link rel="stylesheet" href="style.css">
    <!-- Link register-specific styles -->
    <link rel="stylesheet" href="register_style.css"> 
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            
            <h2 class="auth-title">Create your Account</h2>
            <p class="auth-subtitle">Join us to start planning your perfect Indian getaway.</p>

            <!-- Registration Form -->
            <!-- Note: action and method will connect to Flask later! -->
            <form action="/register" method="POST" class="auth-form">
                
                <div class="form-group">
                    <label for="username">Full Name</label>
                    <input type="text" id="username" name="username" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Repeat your password" required>
                </div>

                <!-- Main Register Button -->
                <button type="submit" class="btn-submit">Sign Up</button>

            </form>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <!-- Your Google Button Integration -->
            <button type="button" class="google_btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24px" height="24px">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.5 24c0-1.55-.15-3.24-.47-4.77H24v9.03h12.75c-.55 2.97-2.22 5.5-4.75 7.2l7.39 5.73C43.7 37.22 46.5 31.25 46.5 24z"/>
                    <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.39-5.73c-2.11 1.42-4.81 2.3-8.5 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <!-- Footer Link back to Login page -->
            <p class="auth-footer">
                Already have an account? <a href="login.html">Log in</a>
            </p>

        </div>
    </div>

</body>
</html>
