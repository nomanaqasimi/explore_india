<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log in page</title>
    <link rel="stylesheet" href="log_Instyle.css">
</head>
<body>
    <main class="log_in_container">
        <div class="branding">
            <div class="logo">
                <img src="../images/login/logo.png" alt="logo">
            </div> 
        <div class="info">
            <p><span id="welcome">Welcome<br>Back,</span><br></span><span id="traveller"> Traveller</span></p><br>
             <p>Log in to your account to explore the world with us!</p>
        </div>
        </div>
        <div class="log_in">
            <div class="signin">
                <h2>Sign In</h2>
            </div>
            <div class="register">
                <p>Don't have an account? <a href="../register.html">Register</a></p>
            </div>
            <form action="#" method="post">
                <div class="form_group">
                    <label for="email"></label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form_group">
                    <label for="password"></label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="form_options">
                    <label id="remember_me">
                        <input type="checkbox" name="remember">
                        Remember me
                        <a href="../forgot_password.html" id="forgot_password">Forgot password?</a>
                    </label>
                    
                </div>
                <button id="log_in_button" type="submit">Log In</button>
            </form>
            <div class="divider">
    <span>or</span>
</div>

<button type="button" class="google_btn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24px" height="24px">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24c0-1.55-.15-3.24-.47-4.77H24v9.03h12.75c-.55 2.97-2.22 5.5-4.75 7.2l7.39 5.73C43.7 37.22 46.5 31.25 46.5 24z"/>
        <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.39-5.73c-2.11 1.42-4.81 2.3-8.5 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <span>Continue with Google</span>
</button>
        </div>
    </main>
</body>
</html>
